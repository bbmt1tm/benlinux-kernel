name: Build BenLinux Firmware

# Builds the ESP-IDF projects under firmware/ for ESP32-P4:
#   benlinux-standalone  Core 0 relay + BenVisor + Core 1 Linux launch
#   benmmu-probe         Stage 0 BenMMU hardware probes (Core 1)
# The Core 1 PMA patch (benlinux-standalone/tools/apply_pma_patch.sh) is applied
# to the container's IDF tree first, so artefacts match a patched local build.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [benlinux-standalone, benmmu-probe]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build ${{ matrix.project }} (ESP-IDF v5.5.1, esp32p4)
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.1
        target: esp32p4
        path: firmware/${{ matrix.project }}
        command: bash ../benlinux-standalone/tools/apply_pma_patch.sh "$IDF_PATH" && idf.py build

    - name: Size report
      run: |
        ls -la firmware/${{ matrix.project }}/build/*.bin

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.project }}-firmware
        path: |
          firmware/${{ matrix.project }}/build/${{ matrix.project }}.bin
          firmware/${{ matrix.project }}/build/${{ matrix.project }}.elf
          firmware/${{ matrix.project }}/build/${{ matrix.project }}.map
          firmware/${{ matrix.project }}/build/bootloader/bootloader.bin
          firmware/${{ matrix.project }}/build/partition_table/partition-table.bin
          firmware/${{ matrix.project }}/build/flash_args
